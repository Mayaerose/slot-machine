<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="description" content="A simple slot machine game built with HTML, CSS, and JavaScript.">
		<meta name="viewport" content="width=device-width, initial-scale=1">
 
		<title>Slot Machine</title>
 
		<!-- external CSS links -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<h1>It's Your Lucky Day!</h1>
 
		<section class="container">
			<div id="moneyDisplay"></div>
			<div class="row">
				<span class="reel"></span>
				<span class="reel"></span>
				<span class="reel"></span>
			</div>
		</section>
 
		<section class="bottom">
			<button class="betButton" id="maxBet">Max Bet: $50</button>
			<button class="betButton" id="minBet">Min Bet: $1</button>
		</section>
 
		<p id="message"></p>
 

		<script src="js/main.js"></script>
	</body>
</html>
